name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build package
        shell: pwsh
        run: ./scripts/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: KanjiPop-win-x64
          path: dist/KanjiPop-win-x64.zip

  mac:
    runs-on: macos-latest   # Apple silicon; builds both architectures
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build dictionary
        run: python tools/build_dict.py
      - name: Build Apple silicon app
        run: ./scripts/build-mac.sh osx-arm64
      - name: Build Intel app
        run: ./scripts/build-mac.sh osx-x64
      - uses: actions/upload-artifact@v4
        with:
          name: KanjiPop-mac
          path: dist/KanjiPop-mac-*.zip

  release:
    needs: [windows, mac]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*.zip
